[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; =========================
; EXTENSION 6001 - MicroSIP
; =========================

[6001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=auth6001
aors=6001
transport=transport-udp
direct_media=no

[auth6001]
type=auth
auth_type=userpass
username=6001
password=CHANGE_ME_6001

[6001]
type=aor
max_contacts=1
remove_existing=yes

