[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

[6001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=auth6001
aors=6001
transport=transport-tls
media_encryption=sdes
direct_media=no

[auth6001]
type=auth
auth_type=userpass
username=6001
password=CHANGE_ME_6001

[6001]
type=aor
max_contacts=1
remove_existing=yes

[6002]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=auth6002
aors=6002
transport=transport-tls
media_encryption=sdes
direct_media=no

[auth6002]
type=auth
auth_type=userpass
username=6002
password=CHANGE_ME_6002

[6002]
type=aor
max_contacts=1
remove_existing=yes